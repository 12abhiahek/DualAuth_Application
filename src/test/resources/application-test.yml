spring:
  datasource:
    url: jdbc:h2:mem:dualauth;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    email:
      secret: test-email-secret-which-is-long-enough-for-jwt
      expiration-seconds: 60
    mobile:
      secret: test-mobile-secret-which-is-long-enough-for-jwt
      expiration-seconds: 60
    issuer: dual-auth-test
